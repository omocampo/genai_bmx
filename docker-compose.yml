services:
  db:
    image: pgvector/pgvector:pg16
    container_name: banamex_postgres_vector
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banamex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banamex_pass}
      POSTGRES_DB: ${POSTGRES_DB:-banamex_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/seed_db.sql:/docker-entrypoint-initdb.d/seed_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banamex_user} -d ${POSTGRES_DB:-banamex_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: banamex_redis_memory
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:

